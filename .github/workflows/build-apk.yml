name: Build Delta ICT Terminal APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'delta-ict-terminal-source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check source archive
        run: test -f delta-ict-terminal-source.zip

      - name: Extract Flutter project
        run: |
          mkdir -p appsrc
          unzip -q delta-ict-terminal-source.zip -d appsrc
          test -f appsrc/pubspec.yaml
          test -f appsrc/lib/main.dart
          rm -rf appsrc/android

      - name: Generate Android platform files
        working-directory: appsrc
        run: flutter create --platforms=android --org com.deltatrade --project-name delta_ict_terminal .

      - name: Install Flutter dependencies
        working-directory: appsrc
        run: flutter pub get

      - name: Analyze source (report only)
        working-directory: appsrc
        continue-on-error: true
        run: flutter analyze

      - name: Build release APK
        working-directory: appsrc
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: delta-ict-terminal-release-apk
          path: appsrc/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
